<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:F;src:url(../ripples/fonts/fraunces-latin-var.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:P;src:url(../ripples/fonts/plex-sans-latin-var.woff2) format("woff2");font-weight:100 700}
html,body{margin:0;height:100%;background:radial-gradient(120% 90% at 50% 38%,#16283a 0%,#0f1c26 55%,#0b151d 100%);overflow:hidden}
#w{position:absolute;inset:0;display:grid;place-items:center}
svg{width:100%;height:100%}
.wm{font:600 168px F;fill:#f2ede4;letter-spacing:-2px}
.tag{font:400 34px P;fill:#b9c8d4;letter-spacing:.3px}
.url{font:500 30px P;fill:#f2a93b;letter-spacing:.5px}
.ring{fill:none;stroke:#f2a93b}
</style></head><body><div id="w"><svg viewBox="0 0 1600 900" id="s">
<g id="rings"></g>
<text id="wm" class="wm" x="800" y="470" text-anchor="middle">r<tspan id="i" fill="#f2a93b">i</tspan>pple</text>
<text id="tag" class="tag" x="800" y="560" text-anchor="middle">Throw a stone. See what it changed.</text>
<text id="url" class="url" x="800" y="640" text-anchor="middle">bensunter.com/ripples</text>
</svg></div><script>
const mode = new URLSearchParams(location.search).get('mode') || 'intro', NS = 'http://www.w3.org/2000/svg';
const wm = document.getElementById('wm'), tag = document.getElementById('tag'), url = document.getElementById('url'), rings = document.getElementById('rings');
url.style.display = mode === 'end' ? '' : 'none';
const R = [0, 1, 2, 3].map(k => { const c = document.createElementNS(NS, 'ellipse'); c.setAttribute('class', 'ring'); rings.appendChild(c); return c; });
const ease = u => 1 - Math.pow(1 - Math.min(1, Math.max(0, u)), 3);
let t0 = null, cx = 0, cy = 0;
function frame(now) {
  if (t0 === null) { t0 = now; const b = document.getElementById('i').getBBox(); cx = b.x + b.width / 2; cy = b.y + b.height * 0.22; }
  const t = (now - t0) / 1000;
  wm.style.opacity = ease(t / 0.7); wm.setAttribute('transform', `translate(0 ${(1 - ease(t / 0.9)) * 18})`);
  tag.style.opacity = ease((t - 0.55) / 0.6); url.style.opacity = ease((t - 0.85) / 0.6);
  R.forEach((c, k) => { const u = ((t - 0.15 - k * 0.42) / 2.4); const r = u <= 0 ? 0 : ease(u) * 520;
    c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('rx', r); c.setAttribute('ry', r * 0.42);
    c.setAttribute('stroke-width', 2.2 * (1 - Math.min(1, Math.max(0, u)))); c.style.opacity = u <= 0 ? 0 : 0.55 * (1 - Math.min(1, u)); });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
