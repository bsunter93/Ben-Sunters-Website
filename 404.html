<script>
// GitHub Pages serves this file for every missing path. Ripple Map line, stop, lands and week URLs are published daily,
// so a fresh one can be requested before its static stub exists: hand the path to the /ripples/line/ shell, which
// restores it with history.replaceState and renders it from the live data (ripples/app.js, boot). Retired v5 numbered
// puzzle pages go to the Ripple Map home. Everything else gets the plain page below.
(function () {
  var l = location, p = l.pathname;
  if (/^\/ripples\/(line|lands|week)\/./.test(p)) { l.replace('/ripples/line/?rm_path=' + encodeURIComponent(p + l.search + l.hash)); return; }
  if (/^\/ripples\/\d+\/(\d\/)?$/.test(p)) l.replace('/ripples/');
})();
</script>
