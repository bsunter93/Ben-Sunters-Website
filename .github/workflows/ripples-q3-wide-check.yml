# Ripple Map wide-lens hand check (ledger 1379): the wide screen v2 (q3_screen_v2_wide) re-run with same-weekday
# placebo and moved dates, to test whether its non-echo candidates are a weekly/academic-calendar artefact. Uses the
# cached Level-4 panel and cached event views only (no new Wikimedia requests expected).
name: Ripples Q3 wide lens same-weekday check

on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/ripples-q3-wide-check.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ripples-q3-wide-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      LAB_CACHE: ${{ github.workspace }}/.cult-cache
      OUT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet numpy
      - uses: actions/cache/restore@v4
        with:
          path: .l4-cache
          key: ripples-l4-v1-none
          restore-keys: ripples-l4-v1-
      - uses: actions/cache/restore@v4
        with:
          path: .cult-cache
          key: ripples-cult-v1-none
          restore-keys: ripples-cult-v1-
      - name: Wide screen v2, same-weekday placebos
        working-directory: ripples/lab
        run: |
          cp "$GITHUB_WORKSPACE/.l4-cache/pv_l4.npz" "$LAB_CACHE/"
          Q3_PROTOCOL=ripples/docs/q3_protocol_wide.md Q3_OUT="$OUT/q3_screen_v2_wide_sameweekday.json" python q3_run.py \
            --families ../corpus/q3_families_v2.tsv --redirects --panel pv_l4.npz --same-weekday
      - name: Store report
        if: always()
        working-directory: ripples/lab
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python q3_upload.py "$OUT/q3_screen_v2_wide_sameweekday.json"
