# Official series and the dose-response design (ripples/lab/series_fetch.py, ripples/docs/dose_response_v1.md):
# CDC YRBS state surveys, legal cannabis vs youth drinking; NIAAA per-capita consumption. No keys; honest UA.
name: Ripples series and dose-response

on:
  push:
    branches: ["claude/**"]
    paths: ["ripples/lab/series_fetch.py", ".github/workflows/ripples-series.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ripples-series
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch series and run the design
        env:
          BUDGET_MIN: "30"
        run: python ripples/lab/series_fetch.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/results && cp ripples/docs/results/series_v1.json /tmp/results/ 2>/dev/null || exit 0
          for i in 1 2 3 4; do
            git fetch -q origin "${GITHUB_REF_NAME}" && git reset -q --hard "origin/${GITHUB_REF_NAME}" || exit 0
            cp /tmp/results/* ripples/docs/results/
            git add ripples/docs/results/series_v1.json || exit 0
            git diff --cached --quiet && exit 0
            git commit -q -m "Ripples: series and dose-response results [skip ci]"
            git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 7
          done
