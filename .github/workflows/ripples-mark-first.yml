# Mark-first search v1.1 (ripples/lab/mark_first.py, ripples/docs/mark_first_v1_1.md): from lasting marks (laws, orders,
# regulations) upstream to the cultural works their records cite. Wikidata, Wikipedia and the Federal Register; no keys.
# Anonymous, honest UA, stops on refusal; resumes from the committed results file on the next push.
name: Ripples mark-first search

on:
  push:
    branches: ["claude/**"]
    paths: ["ripples/lab/mark_first.py", ".github/workflows/ripples-mark-first.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ripples-mark-first
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mark-first search
        env:
          BUDGET_MIN: "270"
        run: python ripples/lab/mark_first.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add ripples/docs/results/mark_first_v1*.json || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Ripples: mark-first search results [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
