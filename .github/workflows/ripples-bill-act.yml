# Bill -> Act resolver (ripples/lab/bill_act.py): for every bill a cultural work was cited in (mark-text results), the
# Act it became, with its Royal Assent date. UK Parliament Bills API and legislation.gov.uk; no keys; honest UA.
name: Ripples bill-act resolver

on:
  push:
    branches: ["claude/**"]
    paths: ["ripples/lab/bill_act.py", ".github/workflows/ripples-bill-act.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ripples-bill-act
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve bills to Acts
        env:
          BUDGET_MIN: "70"
          DATA_GOV_KEY: ${{ secrets.DATA_GOV_KEY }}
        run: python ripples/lab/bill_act.py
      - name: Commit results
        if: always()
        run: |
          # results are placed on top of whatever the branch holds now (a rebase onto a cancelled run's partial
          # commit conflicted on 2026-10-03 and the run's results were lost)
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/results && cp ripples/docs/results/bill_act_v1*.json /tmp/results/ 2>/dev/null || exit 0
          for i in 1 2 3 4; do
            git fetch -q origin "${GITHUB_REF_NAME}" && git reset -q --hard "origin/${GITHUB_REF_NAME}" || exit 0
            cp /tmp/results/* ripples/docs/results/
            git add ripples/docs/results/bill_act_v1*.json || exit 0
            git diff --cached --quiet && exit 0
            git commit -q -m "Ripples: bill-act resolver results [skip ci]"
            git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 7
          done