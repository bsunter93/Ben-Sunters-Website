# Ripple Map confirmation: Super Bowls -> numerals (ripples/docs/q5_superbowl_numerals_protocol.md, ledger 1457).
# Shares the ripples-q3 concurrency group (Wikimedia fetches: two new article series). Report stored in
# ripples.att_q3_results (q5_superbowl_numerals).
name: Ripples Q5 Super Bowl numerals

on:
  push:
    branches: ["work/**"]
    paths: ["ripples/lab/q5_superbowl.py", ".github/workflows/ripples-q5.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ripples-q3
  cancel-in-progress: false

jobs:
  q5:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LAB_CACHE: ${{ github.workspace }}/.cult-cache
      OUT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet numpy
      - uses: actions/cache/restore@v4
        with:
          path: .cult-cache
          key: ripples-cult-v1-${{ github.run_id }}
          restore-keys: ripples-cult-v1-
      - name: Super Bowl numerals confirmation
        working-directory: ripples/lab
        run: |
          test -f "$LAB_CACHE/pv.npz" || { echo "panel cache missing"; exit 1; }
          Q5_OUT="$OUT/q5_superbowl_numerals.json" python q5_superbowl.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cult-cache
          key: ripples-cult-v1-${{ github.run_id }}
      - name: Store report
        if: always()
        working-directory: ripples/lab
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python q3_upload.py "$OUT/q5_superbowl_numerals.json"
