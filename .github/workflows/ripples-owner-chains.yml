# Owner chains v1 (ripples/lab/owner_chains.py): deterministic checks of owner-supplied chains. Anonymous, honest UA.
name: Ripples owner chains

on:
  push:
    branches: ["claude/**"]
    paths: ["ripples/lab/owner_chains.py", ".github/workflows/ripples-owner-chains.yml"]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet numpy
      - run: python ripples/lab/owner_chains.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add ripples/docs/results/owner_chains_v1.json || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Ripples: owner chain checks [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
