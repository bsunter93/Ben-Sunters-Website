# run 2026-09-29: Q4 after screen v3
# Ripple Map Q4 named-subject test (ripples/docs/q4_protocol_v1.md): each event against its own owner-named subject.
# Shares the Q3 concurrency group, so it never runs alongside another Wikimedia fetcher of the Q3 family. Reports are
# stored in ripples.att_q3_results (the job log API truncates long logs).
name: Ripples Q4 named subjects

on:
  push:
    branches: ["claude/**"]
    paths: ["ripples/lab/q4_matched.py", "ripples/corpus/q4_*.tsv", ".github/workflows/ripples-q4.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ripples-q3
  cancel-in-progress: false

jobs:
  q4:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      LAB_CACHE: ${{ github.workspace }}/.cult-cache
      OUT: ${{ github.workspace }}
      WIKIMEDIA_API_TOKEN: ${{ secrets.WIKIMEDIA_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet numpy
      - uses: actions/cache/restore@v4
        with:
          path: .cult-cache
          key: ripples-cult-v1-${{ github.run_id }}
          restore-keys: ripples-cult-v1-
      - name: Named-subject test v1
        working-directory: ripples/lab
        run: |
          test -f "$LAB_CACHE/pv.npz" || { echo "panel cache missing"; exit 1; }
          Q4_OUT="$OUT/q4_subjects_v1.json" python q4_matched.py ../corpus/q4_subjects_v1.tsv
      - name: Named-subject test v1b and held-out dramas (addendum 1)
        if: always()
        working-directory: ripples/lab
        env:
          Q4_PROTOCOL: ripples/docs/q4_protocol_v1.md#addendum-1
        run: |
          ok() { python -c "import json,sys; sys.exit(1 if json.load(open(sys.argv[1])).get('stopped') else 0)" "$1"; }
          ok "$OUT/q4_subjects_v1.json" || { echo "v1 stopped or failed; no more fetches today"; exit 1; }
          Q4_OUT="$OUT/q4_subjects_v1b.json" python q4_matched.py ../corpus/q4_subjects_v1b.tsv
          ok "$OUT/q4_subjects_v1b.json" || { echo "v1b stopped or failed; no more fetches today"; exit 1; }
          Q4_OUT="$OUT/q4_heldout_drama_v1.json" python q4_matched.py ../corpus/q4_heldout_drama_v1.tsv
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cult-cache
          key: ripples-cult-v1-${{ github.run_id }}
      - name: Store report
        if: always()
        working-directory: ripples/lab
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python q3_upload.py "$OUT"/q4_*.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q4-results
          path: q4_*.json
          if-no-files-found: ignore
