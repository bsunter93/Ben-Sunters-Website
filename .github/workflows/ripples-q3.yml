# run 2026-09-29 early start: screen v3 (owner: pull the schedule forward)
# Ripple Map Q3 screen v1 (ripples/docs/q3_protocol.md; method discovery v1, ledger 1283): the frozen discovery method
# on the registered real event families. Reads the cultural-lab panel from the Actions cache, downloads the event
# articles' views and links (Wikimedia, polite, stop on 403/429/503), prints and uploads the report. Candidates only.
name: Ripples Q3 screen

on:
  push:
    branches: ["claude/**"]
    paths: ["ripples/lab/q3_run.py", "ripples/corpus/q3_*.tsv", ".github/workflows/ripples-q3.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ripples-q3
  cancel-in-progress: false

jobs:
  q3:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      LAB_CACHE: ${{ github.workspace }}/.cult-cache
      OUT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet numpy
      - uses: actions/cache/restore@v4
        with:
          path: .cult-cache
          key: ripples-cult-v1-${{ github.run_id }}
          restore-keys: ripples-cult-v1-
      - name: Screen v3 (q3_protocol_v3.md)
        working-directory: ripples/lab
        run: |
          test -f "$LAB_CACHE/pv.npz" || { echo "panel cache missing"; exit 1; }
          Q3_PROTOCOL=ripples/docs/q3_protocol_v3.md Q3_OUT="$OUT/q3_screen_v3.json" python q3_run.py \
            --families ../corpus/q3_families_v3.tsv --redirects
      - name: Store report
        if: always()
        working-directory: ripples/lab
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python q3_upload.py "$OUT/q3_screen_v3.json"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cult-cache
          key: ripples-cult-v1-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q3-results
          path: |
            q3_screen_v3.json
          if-no-files-found: ignore
