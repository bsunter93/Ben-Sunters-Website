# Editor trail v1 (ripples/lab/editor_trail.py, ripples/docs/editor_trail_v1.md): backlinks -> Wikidata typing ->
# daily views -> time-ordered, unusual rises. Anonymous, honest UA, 1 s apart, stops on refusal; resumes from the
# committed results file on the next push.
name: Ripples editor trail

on:
  push:
    branches: ["work/**"]
    paths: ["ripples/lab/editor_trail.py", ".github/workflows/ripples-editor-trail.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ripples-editor-trail
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet numpy
      - name: Editor trail
        env:
          CAP: "260"
          BUDGET_MIN: "215"
        run: python ripples/lab/editor_trail.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add ripples/docs/results/editor_trail_v1.json || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Ripples: editor trail results [skip ci]"
          git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"
