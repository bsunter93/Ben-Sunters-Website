# Ripple map builder (ripples/lab/map_builder.py): builds every config in ripples/maps/ into a page under
# ripples/discover/maps/. Daily Wikipedia attention (anonymous, honest UA, 1 s apart, stop on refusal) and Seattle
# library borrowing (Supabase RPC att_sea_series; missing headings are queued and appear on the next build).
name: Ripples maps

on:
  push:
    branches: ["work/**"]
    paths: ["ripples/maps/**", "ripples/lab/map_builder.py", ".github/workflows/ripples-maps.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ripples-maps
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet numpy
      - name: Build maps
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python ripples/lab/map_builder.py
      - name: Commit pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add ripples/discover/maps ripples/maps/out
          git diff --cached --quiet && exit 0
          git commit -m "Ripples: ripple maps built [skip ci]"
          git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"
