# Chain check v1 (ripples/lab/chain_check.py): deterministic checks of supplied chains (ripples/chains/*.json). Anonymous, honest UA.
name: Ripples chain check

on:
  push:
    branches: ["claude/**", "main"]
    paths: ["ripples/lab/chain_check.py", "ripples/chains/**", ".github/workflows/ripples-chain-check.yml"]
  schedule:
    - cron: "17 6 * * 1"   # weekly, Monday 06:17 UTC: the grades do not drift (truncation test), the data behind them may; results commit back to main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ripples-chain-check
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet numpy
      - run: python ripples/lab/chain_check.py
      - name: Commit results
        if: always()
        run: |
          # results are placed on top of whatever the branch holds now (a rebase onto a cancelled run's partial
          # commit conflicted on 2026-10-03 and the run's results were lost)
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/results && cp ripples/docs/results/chain_check_v1.json /tmp/results/ 2>/dev/null || exit 0
          for i in 1 2 3 4; do
            git fetch -q origin "${GITHUB_REF_NAME}" && git reset -q --hard "origin/${GITHUB_REF_NAME}" || exit 0
            cp /tmp/results/* ripples/docs/results/
            git add ripples/docs/results/chain_check_v1.json || exit 0
            git diff --cached --quiet && exit 0
            git commit -q -m "Ripples: chain checks [skip ci]"
            git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 7
          done