# Mark-text search v1 (ripples/lab/mark_text.py, ripples/docs/mark_text_v1.md): cultural works named inside legal and
# parliamentary records (Hansard, legislation.gov.uk, the Federal Register; GovInfo with an optional key).
# Anonymous, honest UA, stops on refusal; resumes from the committed results file on the next push.
name: Ripples mark-text search

on:
  push:
    branches: ["claude/**"]
    paths: ["ripples/lab/mark_text.py", ".github/workflows/ripples-mark-text.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ripples-mark-text
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mark-text search
        env:
          BUDGET_MIN: "150"
          DATA_GOV_KEY: ${{ secrets.DATA_GOV_KEY }}
        run: python ripples/lab/mark_text.py
      - name: Commit results
        if: always()
        run: |
          # results are placed on top of whatever the branch holds now (a rebase onto a cancelled run's partial
          # commit conflicted on 2026-10-03 and the run's results were lost)
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/results && cp ripples/docs/results/mark_text_v1*.json /tmp/results/ 2>/dev/null || exit 0
          for i in 1 2 3 4; do
            git fetch -q origin "${GITHUB_REF_NAME}" && git reset -q --hard "origin/${GITHUB_REF_NAME}" || exit 0
            cp /tmp/results/* ripples/docs/results/
            git add ripples/docs/results/mark_text_v1*.json || exit 0
            git diff --cached --quiet && exit 0
            git commit -q -m "Ripples: mark-text search results [skip ci]"
            git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 7
          done