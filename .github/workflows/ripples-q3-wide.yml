# Ripple Map Q3 wide lens (ripples/docs/q3_protocol_wide.md): the screen v2 families scored against about 10,000
# Level-4 Vital Articles. Job 1 fetches article views politely (1 s pause, stop on 403/429/503, no retry that day) and
# resumes daily from its own cache until the list is done. Job 2 runs the registered screen once the panel is at least
# 95% complete, and only once (a marker in the cache records it).
name: Ripples Q3 wide lens

on:
  push:
    branches: ["claude/**"]
    paths: ["ripples/lab/l4_panel.py", "ripples/docs/q3_protocol_wide.md", ".github/workflows/ripples-q3-wide.yml"]
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ripples-q3-wide
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      LAB_CACHE: ${{ github.workspace }}/.l4-cache
      L4_BUDGET_MIN: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet numpy
      - uses: actions/cache/restore@v4
        with:
          path: .l4-cache
          key: ripples-l4-v1-${{ github.run_id }}
          restore-keys: ripples-l4-v1-
      - name: Seed from the Level-3 panel cache on the first run
        uses: actions/cache/restore@v4
        with:
          path: .cult-cache
          key: ripples-cult-v1-none
          restore-keys: ripples-cult-v1-
      - name: Copy Level-3 article views (first run only)
        run: |
          mkdir -p .l4-cache/pv
          if [ -d .cult-cache/pv ]; then cp -n .cult-cache/pv/* .l4-cache/pv/ 2>/dev/null || true; fi
          [ -f .l4-cache/vital_l3.json ] || cp .cult-cache/vital_l3.json .l4-cache/ 2>/dev/null || true
          rm -rf .cult-cache
          ls .l4-cache/pv | wc -l
      - name: Fetch Level-4 article views (resumable)
        working-directory: ripples/lab
        run: |
          [ -f "$LAB_CACHE/wide_screen_done" ] && { echo "wide screen already run"; exit 0; }
          python l4_panel.py fetch
          python l4_panel.py build
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .l4-cache
          key: ripples-l4-v1-${{ github.run_id }}-fetch

  screen:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      LAB_CACHE: ${{ github.workspace }}/.cult-cache
      OUT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet numpy
      - uses: actions/cache/restore@v4
        with:
          path: .l4-cache
          key: ripples-l4-v1-${{ github.run_id }}-fetch
          restore-keys: ripples-l4-v1-
      - id: gate
        run: |
          if [ -f .l4-cache/wide_screen_done ]; then echo "run=0" >> "$GITHUB_OUTPUT"; echo "already run";
          elif [ "$(cat .l4-cache/l4_complete 2>/dev/null)" = "1" ]; then echo "run=1" >> "$GITHUB_OUTPUT";
          else echo "run=0" >> "$GITHUB_OUTPUT"; echo "panel not complete yet"; fi
      - uses: actions/cache/restore@v4
        if: steps.gate.outputs.run == '1'
        with:
          path: .cult-cache
          key: ripples-cult-v1-none
          restore-keys: ripples-cult-v1-
      - name: Screen v2 families on the Level-4 panel
        if: steps.gate.outputs.run == '1'
        working-directory: ripples/lab
        run: |
          cp "$GITHUB_WORKSPACE/.l4-cache/pv_l4.npz" "$LAB_CACHE/"
          Q3_PROTOCOL=ripples/docs/q3_protocol_wide.md Q3_OUT="$OUT/q3_screen_v2_wide.json" python q3_run.py \
            --families ../corpus/q3_families_v2.tsv --redirects --panel pv_l4.npz
          touch "$GITHUB_WORKSPACE/.l4-cache/wide_screen_done"
      - name: Store report
        if: steps.gate.outputs.run == '1'
        working-directory: ripples/lab
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python q3_upload.py "$OUT/q3_screen_v2_wide.json"
      - uses: actions/cache/save@v4
        if: steps.gate.outputs.run == '1'
        with:
          path: .l4-cache
          key: ripples-l4-v1-${{ github.run_id }}-screen
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q3-wide-results
          path: q3_screen_v2_wide.json
          if-no-files-found: ignore
